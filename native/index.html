    <body>
            <header class = "header">
               <img id="logo" src="https://drive.google.com/thumbnail?id=1gYfWMu5BUHkD66j3cP1ovNc2RmEwtIYE&sz=w1000" alt="Логотип" width="150" height="100">  
            </header>
            
            <main class ="main">
                <h1>Авторизация</h1>
                <form class="formEmail" method="post" action="" aria-label="Форма входа по email">
                    
                    <div class="formGroup">
                        <label class="labelInput" for="email">Введите электронную почту</label>
                        <input  required id="email" type="email" name="email" autocomplete="email" placeholder="example@gmail.com">
                    </div>
                    
                    <div class="formGroup">
                        <label class="labelInput" for="password">Введите пароль</label>
                        <input required id="password" type="password" name="password" autocomplete="current-password">
                    </div>   
                    
                    <div class="formGroup">
                        <label class="labelInput" for="remember">Сохранять сессию</label>
                        <input id="remember" type="checkbox" name="remember" value="on">
                    </div>
                    
                    <button type="submit">Войти</button>
                </form>

                <form class="formSocialMedia" aria-label="Форма входа через социальные сети">
                    <button type="button">Войти через MAX</button>
                    <button type="button">Войти через Госуслуги</button>
                </form>
            </main>
            
            <footer>
                <h2>Связаться со мной</h2>
                <nav class="contactWithMe">
                    <ul>
                        <li>
                            <a href="https://vk.ru/menyaitakznaut" target="_blank" rel="noopener noreferrer" title="Написать мне в ВКонтакте"
                            aria-label="VK — написать сообщение в ВКонтакте">
                            VK
                            </a>
                        </li>
                        <li>
                            <a href="mailto:daigchepurnykh@edu.hse.ru" title="Написать мне письмо на daigchepurnykh@edu.hse.ru"
                            aria-label="Написать мне письмо на daigchepurnykh@edu.hse.ru">
                            daigchepurnykh@edu.hse.ru
                            </a>
                        </li>
                        <li>
                            <a href="https://t.me/MenyaITakZnaut" target="_blank" rel="noopener noreferrer" title="Написать мне в Телеграм"
                            aria-label="TG — написать сообщение в Телеграм">
                            TG
                            </a>
                        </li>
                    </ul>
                </nav>
                <p>Создано на этапе работы с нативными технологиями</p>
